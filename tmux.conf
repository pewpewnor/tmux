# plugins
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-cpu'

# settings
set -s escape-time 0 # adjust escape key delay, if we don't have this, then we need to press <ESC> twice when using vim
set -g mouse on # enable mouse click to focus panes
set -gq allow-passthrough on # for image.nvim
set -g detach-on-destroy off # don't detach when you kill session
# set -g status-position top # set tmux status bar to top instead of bottom
# enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# start window number by 1 (not 0)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# the default prefix key is ctrl + b
# NOTE:
# - don't set this to C-m, it will cause massive lag for whatever reason
# - don't set it to [, it will cause having to press <ESC> twice in vim regardless of the set escape-time fix
# - C-0 will never be possible
set -g prefix M-b

# for yanking buffer history like vim, prefix + \ to start, v to select or ctrl + v for rectangle select, y to copy / yank
set -g mode-keys vi # do this, otherwise by default, it would be emacs style to move around
bind -n M-\\ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle

# enable mouse highlight to automatically copy to clipboard, you can also press ENTER to copy currently highlighted text
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-vi C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down
# update default binding of ENTER to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# split panes
# NOTE: binding anything to M-[ will break yazi
bind -n M-p split-window -h -c "#{pane_current_path}"
bind -n M-P split-window -h
bind -n M-o split-window -v -c "#{pane_current_path}"
bind -n M-O split-window -v -c "#{pane_current_path}" -l 10

# switch to another pane
bind -n M-h select-pane -L
bind -n M-j select-pane -U
bind -n M-k select-pane -D
bind -n M-l select-pane -R

# resize pane in that direction
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5

# rotate panes around
bind -n M-< rotate-window -U
bind -n M-> rotate-window -D
    # bind -n M-< swap-pane -D
    # bind -n M-> swap-pane -U

# other panes stuff
bind -n M-d kill-pane
bind -n M-z resize-pane -Z

# create & destroy window
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-T new-window
bind -n M-w kill-window

# switch to previous / next window
bind -n M-, previous-window
bind -n M-. next-window

# switch to that window number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# swap with window number
bind -n M-m command-prompt -p "Swap with window number: " "swap-window -t %1"

# sessions manipulation
bind -n M-n new-session
bind -n M-r command-prompt -p "Rename session to:" "rename-session '%1'"
bind -n M-s choose-session
bind -n M-D kill-session
bind -n M-N command-prompt -p "Enter session name:" "new-session -s '%%'; send-keys C-u 'f && clear' C-m"

# switch to previous / next session
# note: binding anything to M-[ will break yazi
bind -n M-- switch-client -p
bind -n M-= switch-client -n

# others
bind -n M-\; command-prompt

# execute a command in the terminal
bind -n M-f send-keys C-u "f" C-m
bind -n M-a send-keys C-u "f h" C-m
bind -n M-c send-keys C-u "f n h" C-m
bind -n M-g split-window -d -c "#{pane_current_path}" \; last-pane \; resize-pane -Z \; send-keys "lazygit" C-m

# configure catpuccin plugin
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
    # set -agF status-right "#{E:@catppuccin_status_cpu}" # show cpu usage percentage
set -ag status-right "#{E:@catppuccin_status_session}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"
set -g @catppuccin_window_text " #{b:pane_current_path}"
